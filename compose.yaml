name: mafia-team2

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      DB_URL: jdbc:postgresql://db:5432/mafia_db
      DB_USERNAME: mafia
      DB_PASSWORD: ${MAFIA_DB_PASSWORD:?Set MAFIA_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "3", "-o", "/dev/null", "http://127.0.0.1:3200/"]
      interval: 5s
      timeout: 4s
      start_period: 45s
      retries: 12

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: mafia_db
      POSTGRES_USER: mafia
      POSTGRES_PASSWORD: ${MAFIA_DB_PASSWORD:?Set MAFIA_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "mafia", "-d", "mafia_db"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
