<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mafia Game Manager</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/5.3.8/css/bootstrap.min.css}">
</head>
<body class="bg-body-tertiary">
<main class="container py-4 py-lg-5">
    <header class="mb-4 mb-lg-5">
        <p class="small fw-semibold text-primary text-uppercase mb-2">Mafia multiplayer</p>
        <h1 class="display-6 fw-bold mb-1">Play together</h1>
        <p class="text-body-secondary mb-0">Create a room for your group or join one with an invite code.</p>
    </header>
    <p id="message" class="alert alert-info py-2 mb-4" role="status" aria-live="polite" hidden></p>

    <div class="row g-4 align-items-stretch">
        <div class="col-12 col-md-6">
            <section class="card border-0 shadow-sm h-100" aria-labelledby="join-heading">
                <div class="card-body d-flex flex-column p-4 p-lg-5">
                    <p class="small fw-semibold text-primary text-uppercase mb-2">Have an invite?</p>
                    <h2 id="join-heading" class="h4 fw-bold mb-2">Join a room</h2>
                    <p class="text-body-secondary mb-4">Enter the room code and choose the name your group will see.</p>
                    <form id="join-form" class="mt-auto">
                        <div class="mb-3">
                            <label for="join-code" class="form-label fw-semibold">Room code</label>
                            <input id="join-code" class="form-control" minlength="8" maxlength="8" autocomplete="off" placeholder="8-character code" required>
                        </div>
                        <div class="mb-4">
                            <label for="guest-nickname" class="form-label fw-semibold">Your nickname</label>
                            <input id="guest-nickname" class="form-control" maxlength="40" autocomplete="nickname" placeholder="Enter your nickname" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Join room</button>
                    </form>
                </div>
            </section>
        </div>
        <div class="col-12 col-md-6">
            <section class="card border-0 shadow-sm h-100" aria-labelledby="create-heading">
                <div class="card-body d-flex flex-column p-4 p-lg-5">
                    <p class="small fw-semibold text-primary text-uppercase mb-2">Start a new game</p>
                    <h2 id="create-heading" class="h4 fw-bold mb-2">Create a room</h2>
                    <p class="text-body-secondary mb-4">Set up your room, then share its invite link with your players.</p>
                    <form id="create-form" class="mt-auto">
                        <div class="mb-3">
                            <label for="host-nickname" class="form-label fw-semibold">Your nickname</label>
                            <input id="host-nickname" class="form-control" maxlength="40" autocomplete="nickname" placeholder="Enter your nickname" required>
                        </div>
                        <div class="mb-4">
                            <label for="mafia-count" class="form-label fw-semibold">Number of Mafia</label>
                            <input id="mafia-count" class="form-control" type="number" min="1" value="1" required>
                        </div>
                        <button class="btn btn-primary w-100" type="submit">Create room</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
<script th:src="@{/vendor/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/vendor/stomp/7.5.0/stomp.umd.min.js}"></script>
<script>
    const message = document.getElementById("message");

    function showMessage(text, isError = false) {
        message.textContent = text;
        message.className = text
            ? `alert ${isError ? "alert-danger" : "alert-info"} py-2 mb-4`
            : "";
        message.hidden = !text;
    }

    async function submitJson(path, data) {
        const response = await fetch(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        const text = await response.text();
        let body = null;
        if (text) {
            try {
                body = JSON.parse(text);
            } catch (error) {
                throw new Error("The server returned an invalid response.");
            }
        }
        if (!response.ok) {
            throw new Error(body && body.detail ? body.detail : `Request failed (${response.status}).`);
        }

        const token = response.headers.get("X-Session-Token");
        if (!token) {
            throw new Error("The server did not return a guest session token.");
        }
        return { body, token };
    }

    function openRoom(gameId, joinCode, nickname, token, host) {
        sessionStorage.setItem("mafiaDemoGameId", gameId);
        sessionStorage.setItem("mafiaDemoJoinCode", joinCode);
        sessionStorage.setItem("mafiaDemoNickname", nickname);
        sessionStorage.setItem("mafiaDemoSessionToken", token);
        sessionStorage.setItem("mafiaDemoIsHost", String(host));
        window.location.href = "/game.html?gameId=" + encodeURIComponent(gameId);
    }

    document.getElementById("create-form").addEventListener("submit", async event => {
        event.preventDefault();
        showMessage("");
        const nickname = document.getElementById("host-nickname").value.trim();
        const mafiaCount = Number(document.getElementById("mafia-count").value);
        try {
            const result = await submitJson("/api/games", { nickname, mafiaCount });
            openRoom(result.body.id, result.body.joinCode, nickname, result.token, true);
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    document.getElementById("join-form").addEventListener("submit", async event => {
        event.preventDefault();
        showMessage("");
        const joinCode = document.getElementById("join-code").value.trim().toUpperCase();
        const nickname = document.getElementById("guest-nickname").value.trim();
        try {
            const result = await submitJson("/api/players", { joinCode, nickname });
            openRoom(result.body.gameId, joinCode, result.body.player.nickname, result.token, false);
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    const invitationCode = new URLSearchParams(window.location.search).get("join");
    if (invitationCode) {
        document.getElementById("join-code").value = invitationCode.toUpperCase();
    }
    if (new URLSearchParams(window.location.search).get("notice") === "room-closed") {
        showMessage("The host closed the room.");
    }
</script>
</body>
</html>
